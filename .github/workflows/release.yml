name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: BingPaperDesktop.exe
            args: ""
          - os: macos-latest
            platform: darwin/universal
            artifact: BingPaperDesktop.dmg
            args: ""
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: BingPaperDesktop
            args: -tags webkit2_41

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Build portable version
            wails build -platform ${{ matrix.platform }}
            # Move portable to a temporary location to avoid it being cleaned
            cp build/bin/BingPaperDesktop.exe BingPaperDesktop-Portable.exe
            # Build installer version (skip frontend build to save time)
            wails build -platform ${{ matrix.platform }} -nsis -s
            # Restore portable version
            mv BingPaperDesktop-Portable.exe build/bin/BingPaperDesktop.exe
          else
            wails build -platform ${{ matrix.platform }} ${{ matrix.args }}
          fi

      - name: Prepare Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP_NAME="BingPaperDesktop"
          OUTPUT_DIR="build/bin"
          APP_PATH="$OUTPUT_DIR/$APP_NAME.app"
          
          # Create DMG
          DMG_TEMP="build/bin/dmg_temp"
          rm -rf "$DMG_TEMP"
          mkdir -p "$DMG_TEMP"
          cp -R "$APP_PATH" "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$DMG_TEMP" -ov -format UDZO "$OUTPUT_DIR/$APP_NAME.dmg"
          rm -rf "$DMG_TEMP"
          
          # Create ZIP of .app
          cd "$OUTPUT_DIR"
          zip -r "${APP_NAME}-macOS.zip" "${APP_NAME}.app"

      - name: Rename Windows Installer
        if: matrix.os == 'windows-latest'
        run: |
          echo "Listing build/bin directory:"
          ls -R build/bin
          # Look for any file with -installer.exe suffix
          INSTALLER_FILE=$(find build/bin -name "*-installer.exe" | head -n 1)
          if [ -n "$INSTALLER_FILE" ]; then
            echo "Found installer: $INSTALLER_FILE"
            mv "$INSTALLER_FILE" build/bin/BingPaperDesktop-Installer.exe
          else
            echo "Warning: Could not find installer file with -installer.exe suffix"
            # Fallback to check common names
            if [ -f build/bin/BingPaperDesktop-amd64-installer.exe ]; then
              mv build/bin/BingPaperDesktop-amd64-installer.exe build/bin/BingPaperDesktop-Installer.exe
            elif [ -f build/bin/BingPaperDesktop-windows-amd64-installer.exe ]; then
              mv build/bin/BingPaperDesktop-windows-amd64-installer.exe build/bin/BingPaperDesktop-Installer.exe
            fi
          fi
          echo "Final build/bin content:"
          ls -R build/bin
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            build/bin/*.exe
            build/bin/*.dmg
            build/bin/*.zip
            build/bin/BingPaperDesktop

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "BingPaperDesktop" \) -exec cp {} release_assets/ \;
          ls -R release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
