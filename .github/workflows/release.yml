name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        include:
          - platform: 'windows-latest'
            go-version: '1.26.1'
            node-version: '20'
          - platform: 'macos-latest'
            go-version: '1.26.1'
            node-version: '20'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails app
        shell: bash
        run: |
          # 检查必填 Secrets
          if [[ -z "${{ secrets.AUTHOR_NAME }}" || -z "${{ secrets.AUTHOR_EMAIL }}" ]]; then
            echo "Error: AUTHOR_NAME or AUTHOR_EMAIL secret is not set."
            exit 1
          fi

          # 替换 wails.json 中的个人信息
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            sed -i '' "s/AUTHOR_NAME/${{ secrets.AUTHOR_NAME }}/g" wails.json
            sed -i '' "s/AUTHOR_EMAIL/${{ secrets.AUTHOR_EMAIL }}/g" wails.json
          else
            sed -i "s/AUTHOR_NAME/${{ secrets.AUTHOR_NAME }}/g" wails.json
            sed -i "s/AUTHOR_EMAIL/${{ secrets.AUTHOR_EMAIL }}/g" wails.json
          fi

          # 计算版本信息
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ $VERSION != v* ]]; then
            VERSION=$(git describe --tags --always 2>/dev/null || echo "v0.0.0")
          fi
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u "+%Y-%m-%d %H:%M:%S")
          
          LDFLAGS="-X 'BingPaperDesktop/internal/app.Version=$VERSION' -X 'BingPaperDesktop/internal/app.CommitHash=$COMMIT_HASH' -X 'BingPaperDesktop/internal/app.BuildTime=$BUILD_TIME'"
          
          echo "Building version: $VERSION"
          wails build -platform ${{ matrix.platform == 'windows-latest' && 'windows/amd64' || 'darwin/universal' }} -ldflags "$LDFLAGS"

      - name: MacOS download tools for code signing and app notarization
        if: matrix.platform == 'macos-latest'
        run: |
          brew install Bearer/tap/gon create-dmg

      - name: Import Code-Signing Certificates for macOS
        if: matrix.platform == 'macos-latest'
        run: |
          # 检查 P12 证书相关的 Secrets
          if [[ -z "${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}" || -z "${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}" ]]; then
            echo "Error: APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 or APPLE_DEVELOPER_CERTIFICATE_PASSWORD is not set."
            exit 1
          fi
      - name: Import Code-Signing Certificates for macOS (Action)
        if: matrix.platform == 'macos-latest'
        uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Sign our macOS binary
        if: matrix.platform == 'macos-latest'
        run: |
          # 检查必填 Secrets
          if [[ -z "${{ secrets.APPLE_ID_USER }}" || -z "${{ secrets.APPLE_PASSWORD }}" || -z "${{ secrets.APPLE_PROVIDER }}" || -z "${{ secrets.APPLE_IDENTITY }}" ]]; then
            echo "Error: One or more Apple signing secrets are missing."
            exit 1
          fi

          echo "Signing Package"
          # 使用 sed 替换配置文件中的占位符
          # 为 gon-sign-app.json 替换所有必要信息
          sed -i '' "s/APPLE_BUNDLE_ID/${{ secrets.APPLE_BUNDLE_ID || 'com.hxuanyu.BingPaperDesktop' }}/g" ./build/darwin/gon-sign-app.json
          sed -i '' "s/APPLE_IDENTITY/${{ secrets.APPLE_IDENTITY }}/g" ./build/darwin/gon-sign-app.json
          sed -i '' "s/APPLE_ID_USER/${{ secrets.APPLE_ID_USER }}/g" ./build/darwin/gon-sign-app.json
          sed -i '' "s/APPLE_PASSWORD/${{ secrets.APPLE_PASSWORD }}/g" ./build/darwin/gon-sign-app.json
          sed -i '' "s/APPLE_PROVIDER/${{ secrets.APPLE_PROVIDER }}/g" ./build/darwin/gon-sign-app.json
          
          # 为 gon-notarize.json 替换所有必要信息
          sed -i '' "s/APPLE_BUNDLE_ID/${{ secrets.APPLE_BUNDLE_ID || 'com.hxuanyu.BingPaperDesktop' }}/g" ./build/darwin/gon-notarize.json
          sed -i '' "s/APPLE_ID_USER/${{ secrets.APPLE_ID_USER }}/g" ./build/darwin/gon-notarize.json
          sed -i '' "s/APPLE_PASSWORD/${{ secrets.APPLE_PASSWORD }}/g" ./build/darwin/gon-notarize.json
          sed -i '' "s/APPLE_PROVIDER/${{ secrets.APPLE_PROVIDER }}/g" ./build/darwin/gon-notarize.json
          
          # 1. 签名 .app 
          gon -log-level=info ./build/darwin/gon-sign-app.json

          # 2. 手动创建 ZIP 包
          echo "Generating professional ZIP"
          rm -f ./build/bin/BingPaperDesktop_macos.zip
          ditto -c -k --sequesterRsrc --keepParent "./build/bin/BingPaperDesktop.app" "./build/bin/BingPaperDesktop_macos.zip"

          # 3. 使用 create-dmg 生成 DMG
          echo "Generating professional DMG"
          rm -f ./build/bin/BingPaperDesktop_macos.dmg
          create-dmg \
            --volname "BingPaperDesktop" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "BingPaperDesktop.app" 175 190 \
            --hide-extension "BingPaperDesktop.app" \
            --app-drop-link 425 190 \
            "./build/bin/BingPaperDesktop_macos.dmg" \
            "./build/bin/BingPaperDesktop.app"

          # 4. 增加重试逻辑以应对网络波动导致的公证失败
          MAX_RETRIES=3
          COUNT=0
          until [ $COUNT -ge $MAX_RETRIES ]
          do
            gon -log-level=info ./build/darwin/gon-notarize.json && break
            COUNT=$[$COUNT+1]
            echo "Gon failed, retrying in 30 seconds... ($COUNT/$MAX_RETRIES)"
            sleep 30
          done

          if [ $COUNT -eq $MAX_RETRIES ]; then
            echo "Gon failed after $MAX_RETRIES attempts."
            exit 1
          fi
          
          ls -l ./build/bin/

      # - name: Sign Windows binaries
      #   if: matrix.platform == 'windows-latest'
      #   shell: powershell
      #   run: |
      #     echo "Creating certificate file"
      #     New-Item -ItemType directory -Path certificate
      #     Set-Content -Path certificate\certificate.txt -Value '${{ secrets.WIN_SIGNING_CERT }}'
      #     certutil -decode certificate\certificate.txt certificate\certificate.pfx
      #     echo "Signing our binaries"
      #     \$signtool = "C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe"
      #     if (!(Test-Path \$signtool)) {
      #         \$signtool = "signtool.exe"
      #     }
      #     & \$signtool sign /fd sha256 /tr http://ts.ssl.com /f certificate\certificate.pfx /p '${{ secrets.WIN_SIGNING_CERT_PASSWORD }}' .\build\bin\BingPaperDesktop.exe

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd build/bin
          for file in *; do
            if [[ -f "$file" && "$file" != *.sha256 ]]; then
              if [[ "$file" == *.exe || "$file" == *.zip || "$file" == *.dmg ]]; then
                sha256sum "$file" > "$file.sha256"
              fi
            fi
          done

      - name: upload artifacts macOS
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BingPaperDesktop-macos
          path: |
            build/bin/*.zip
            build/bin/*.dmg
            build/bin/*.sha256

      - name: upload artifacts windows
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BingPaperDesktop-windows
          path: |
            build/bin/*.exe
            build/bin/*.sha256

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BingPaperDesktop-macos/*
            artifacts/BingPaperDesktop-windows/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
